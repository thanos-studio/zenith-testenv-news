<h1>언론사 목록</h1>
<ul>
    {% for press in presses %}
        <li>
            <a href="{% url 'Main:article_list' press.id %}">
                {% if press.logo %}
                    <img src="{{ press.logo.url }}" width="50">
                {% endif %}
                {{ press.name }}
            </a>
        </li>
    {% endfor %}
</ul>
