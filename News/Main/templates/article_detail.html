<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ article.title }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background-color: #f2f2f2; padding: 10px 20px; display: flex; justify-content: flex-end; }
        .login-buttons button { margin-left: 10px; }
        .article-content { padding: 20px; }
        .article-content h1 { font-size: 28px; margin-bottom: 10px; }
        .article-meta { color: #555; margin-bottom: 20px; }
        .article-body img { max-width: 100%; margin: 10px 0; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px 15px; background-color: #007BFF; color: white; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <div class="login-buttons">
            <a href="{% url 'login' %}"><button>로그인</button></a>
            <a href="{% url 'signup' %}"><button>회원가입</button></a>
        </div>
    </header>

    <section class="article-content">
        <h1>{{ article.title }}</h1>
        <div class="article-meta">
            <span>{{ article.press.name }}</span> | 
            <span>{{ article.journalist }}</span> | 
            <span>{{ article.published_date }}</span>
        </div>
        <div class="article-body">
            {% if article.image %}
                <img src="{{ article.image.url }}" alt="기사 이미지">
            {% endif %}
            <p>{{ article.content|linebreaks }}</p>
        </div>
        <a href="{% url 'press_detail' article.press.id %}" class="back-btn">메인 페이지로 돌아가기</a>
    </section>
</body>
</html>
