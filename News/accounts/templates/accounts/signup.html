{% extends 'base.html' %}
{% block title %}회원가입 · Zenith News{% endblock %}

{% block content %}
<section class="card auth-card">
    <h1>회원가입</h1>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="form-field">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">가입 완료</button>
        </div>
    </form>
    <p class="muted">이미 계정이 있으신가요? <a href="{% url 'login' %}">로그인</a></p>
</section>
{% endblock %}
