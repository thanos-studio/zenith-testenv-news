{% extends 'base.html' %}
{% block title %}로그인 · Zenith News{% endblock %}

{% block content %}
<section class="card auth-card">
    <h1>로그인</h1>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="form-field">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">로그인</button>
        </div>
    </form>
    <p class="muted">아직 계정이 없으신가요? <a href="{% url 'signup' %}">회원가입</a></p>
</section>
{% endblock %}
